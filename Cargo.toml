[workspace]
members = [
    "crates/rvs_core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RVS Core Modernization Team"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
debug = false
overflow-checks = false

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
